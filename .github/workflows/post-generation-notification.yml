name: Post-Generation Notification

on:
  workflow_run:
    workflows: ["Generate Blog Posts"]
    types: [completed]
  # Manual resend requires the exact generating run ID; no guessed counts.
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'GitHub Actions run ID of the generation job to verify'
        required: true
        type: string

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install notification dependencies
        run: pip install python-dotenv supabase pytz
      - name: Verify job and saved posts before emailing
        env:
          SOURCE_GITHUB_RUN_ID: ${{ github.event.workflow_run.id || github.event.inputs.source_run_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ADMIN_NOTIFICATION_EMAIL: ${{ secrets.ADMIN_NOTIFICATION_EMAIL }}
        run: python scripts/notify_post_generation_status.py
      - name: Summary
        if: success()
        run: |
          echo '## Post-Generation Notification' >> "$GITHUB_STEP_SUMMARY"
          echo 'Verified job and saved article counts before sending any email.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Review the Youdle dashboard for actual saved drafts and failures.' >> "$GITHUB_STEP_SUMMARY"
