name: Revise existing scheduled October 31 newsletter
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/revise-oct31-newsletter.yml'
      - 'scripts/revise_oct31_scheduled_newsletter.py'
      - 'scripts/fix_oct31_single_campaign.py'
permissions:
  contents: read
concurrency:
  group: same-oct31-newsletter-edit
  cancel-in-progress: false
jobs:
  revise-existing:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install mail tools
        run: python -m pip install 'supabase>=2,<3' 'mailchimp3>=3,<4' 'pytz>=2024' 'python-dotenv>=1,<2' 'pyspellchecker>=0.7' 'fastapi>=0.104' 'pydantic>=2'
      - name: Update the same scheduled campaign and verify
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
          MAILCHIMP_LIST_ID: ${{ secrets.MAILCHIMP_LIST_ID }}
          MAILCHIMP_SERVER_PREFIX: ${{ secrets.MAILCHIMP_SERVER_PREFIX }}
        run: python -m scripts.fix_oct31_single_campaign
