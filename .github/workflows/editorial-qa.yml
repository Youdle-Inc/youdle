name: Grocery Brief editorial QA

on:
  push:
    branches:
      - fix/affordable-newsletter-imgbb-links-20261017
  pull_request:
    paths:
      - 'prompts/**'
      - 'headline_policy.py'
      - 'reflection_agent.py'
      - 'langchain_blog_agent.py'
      - 'blog_post_graph.py'
      - 'mailchimp_campaign.py'
      - 'api/routes/newsletters.py'
      - 'tests/**'
      - '.github/workflows/editorial-qa.yml'

permissions:
  contents: read

jobs:
  editorial-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out tested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt 'pytest>=8,<9'
      - name: Compile Python source
        run: |
          python -m compileall -q headline_policy.py reflection_agent.py langchain_blog_agent.py blog_post_graph.py mailchimp_campaign.py prompts/
      - name: Run no-service tests
        env:
          OPENAI_API_KEY: ''
          EXA_API_KEY: ''
          GEMINI_API_KEY: ''
          IMGBB_API_KEY: ''
        run: |
          python -m pytest -q tests/test_headline_policy.py tests/test_newsletter_article_links.py tests/test_prompt_pipeline.py
