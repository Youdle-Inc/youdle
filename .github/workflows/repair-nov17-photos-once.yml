name: Repair Nov 17 Photos Once
on:
  push:
    branches:
      - hotfix/newsletter-images-prod-20261120
    paths:
      - .github/workflows/repair-nov17-photos-once.yml
permissions:
  contents: read
concurrency:
  group: grocerysos-nov17-photo-repair-once
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout reviewed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install existing image and publishing dependencies
        run: |
          python -m pip install 'google-genai>=2.28.0,<3' 'supabase>=2.0.0,<3' 'google-api-python-client>=2.100.0' 'google-auth>=2.23.0' 'google-auth-oauthlib>=1.1.0' 'python-dotenv>=1.0.0'
      - name: Preflight required credentials without revealing values
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_NEWSLETTER_IMAGE_API_KEY: ${{ secrets.GEMINI_NEWSLETTER_IMAGE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          required = ['SUPABASE_URL', 'BLOGGER_BLOG_ID', 'BLOGGER_CLIENT_ID', 'BLOGGER_CLIENT_SECRET', 'BLOGGER_REFRESH_TOKEN']
          missing = [name for name in required if not os.environ.get(name)]
          if not (os.environ.get('SUPABASE_SERVICE_ROLE_KEY') or os.environ.get('SUPABASE_KEY')):
              missing.append('SUPABASE_SERVICE_ROLE_KEY')
          if not (os.environ.get('GEMINI_NEWSLETTER_IMAGE_API_KEY') or os.environ.get('GEMINI_API_KEY')):
              missing.append('GEMINI_NEWSLETTER_IMAGE_API_KEY')
          if missing:
              raise SystemExit('STOP: GitHub Actions is missing these secret names: ' + ', '.join(missing))
          print('Credential names present. No secret values printed.')
          PY
      - name: Dry-run existing 8 post IDs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m scripts.repair_nov17_newsletter_photos
      - name: Add images without sending any email
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_NEWSLETTER_IMAGE_API_KEY: ${{ secrets.GEMINI_NEWSLETTER_IMAGE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: python -m scripts.repair_nov17_newsletter_photos --execute
