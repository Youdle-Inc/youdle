name: Repair Nov 17 Newsletter Photos

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Repair only the eight identified Nov 17 post IDs? Enter YES'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: repair-nov17-newsletter-photos
  cancel-in-progress: false

jobs:
  repair:
    if: ${{ github.event.inputs.confirm == 'YES' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install existing provider and storage clients
        run: |
          python -m pip install 'google-genai>=2.28.0,<3' 'supabase>=2.0.0,<3' \
            'google-api-python-client>=2.100.0' 'google-auth>=2.23.0' \
            'google-auth-oauthlib>=1.1.0' 'python-dotenv>=1.0.0'
      - name: Dry run exact live post selection
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m scripts.repair_nov17_newsletter_photos
      - name: Repair existing photos in place
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_NEWSLETTER_IMAGE_API_KEY: ${{ secrets.GEMINI_NEWSLETTER_IMAGE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: python -m scripts.repair_nov17_newsletter_photos --execute
