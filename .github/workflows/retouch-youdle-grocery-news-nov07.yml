name: Retouch Youdle Grocery News November 7
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retouch-youdle-grocery-news-nov07.yml'
permissions:
  contents: read
concurrency:
  group: youdle-grocery-news-nov07-retouch
  cancel-in-progress: false
jobs:
  retouch-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install newsletter dependencies
        run: python -m pip install 'supabase>=2,<3' 'mailchimp3>=3,<4' 'pytz>=2024' 'python-dotenv>=1,<2' 'pyspellchecker>=0.7' 'fastapi>=0.104' 'pydantic>=2'
      - name: Apply approved photo-rich layout to same scheduled Youdle campaign
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
          MAILCHIMP_LIST_ID: ${{ secrets.MAILCHIMP_LIST_ID }}
          MAILCHIMP_SERVER_PREFIX: ${{ secrets.MAILCHIMP_SERVER_PREFIX }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          from collections import Counter
          import re
          from supabase_storage import get_supabase_client
          from mailchimp_campaign import MailchimpCampaign

          CID="9a0996117e"
          NID="1b3d132a-6095-4666-897b-3a260cd72654"
          TARGET=datetime(2026,11,7,15,0,tzinfo=timezone.utc)
          SUBJECT="Salmonella and thallium: 4 foods to check"
          DESIGN=Path("newsletter_templates/2026-11-07_youdle_grocery_news_approved.html")

          def as_utc(value):
              dt=datetime.fromisoformat(str(value).replace("Z","+00:00"))
              return dt.replace(tzinfo=timezone.utc) if dt.tzinfo is None else dt.astimezone(timezone.utc)

          def images(body):
              return re.findall(r'<img\b[^>]*\bsrc="([^"]+)"',body,re.I)

          def inspect(body,original,posts):
              if not all(x in body for x in ("Youdle Logo","Top Grocery Stories","The grocery stories that matter.","*|UNSUB|*","*|LIST:ADDRESSLINE|*")):
                  raise RuntimeError("Approved design, logo or required Mailchimp footer is missing")
              if any(x in body for x in ("Food Safety Alerts","GrocerySOS","grocerysos.com","mailto:info@getyoudle.com")):
                  raise RuntimeError("Unapproved recall section or branding")
              if len(images(body))!=8 or Counter(images(body))!=Counter(images(original)):
                  raise RuntimeError("Original logo/photo URLs not preserved")
              for p in posts:
                  if p["status"]!="published" or not p.get("blogger_url") or not p.get("image_url"):
                      raise RuntimeError("Published article or photo unavailable")
                  if p["blogger_url"] not in body or p["image_url"] not in images(body):
                      raise RuntimeError("Existing article link/photo missing")
              order=posts[1:]+posts[:1]
              offsets=[body.index(p["blogger_url"]) for p in order]
              if len(set(offsets))!=7 or offsets!=sorted(offsets):
                  raise RuntimeError("Recall must appear seventh, in same story section")

          def verify_only_one_edition(mail, expected):
              """Read ALL Mailchimp campaign summaries, then verify any scheduled ones by ID."""
              expected_list=(expected.get("recipients") or {}).get("list_id")
              if not expected_list:
                  raise RuntimeError("Mailchimp campaign audience missing")
              candidates=[]
              offset=0
              total_seen=0
              while True:
                  listing=mail.client.campaigns.all(params={"count":100,"offset":offset})
                  campaigns=listing.get("campaigns") or []
                  for item in campaigns:
                      if item.get("status") not in ("schedule","scheduled"):
                          continue
                      cid=str(item.get("id") or "")
                      if not cid:
                          raise RuntimeError("Mailchimp returned a scheduled campaign without an ID")
                      # The summary response does not always include send_time or list_id.
                      detail=mail.client.campaigns.get(cid)
                      if detail.get("status") not in ("schedule","scheduled"):
                          continue
                      if (detail.get("recipients") or {}).get("list_id") != expected_list:
                          continue
                      send=detail.get("send_time")
                      if not send:
                          raise RuntimeError("Scheduled Mailchimp campaign missing time: "+cid)
                      if as_utc(send).date()==TARGET.date():
                          candidates.append(cid)
                  total_seen+=len(campaigns)
                  offset+=len(campaigns)
                  if not campaigns or offset>=int(listing.get("total_items") or 0):
                      break
              print("MAILCHIMP PREFLIGHT: checked "+str(total_seen)+" campaign summaries; scheduled Nov 7 to target audience: "+str(candidates),flush=True)
              if candidates != [CID]:
                  raise RuntimeError("Not exactly one Mailchimp campaign scheduled for this audience today: "+str(candidates))
              print("SUCCESS: exactly one November 7 Mailchimp campaign scheduled for the intended audience",flush=True)

          def main():
              if datetime.now(timezone.utc)>=TARGET: raise RuntimeError("The one-time send has already started; refusing changes")
              db=get_supabase_client()
              if db is None: raise RuntimeError("Database connection unavailable")
              rows=db.table("newsletters").select("*").eq("id",NID).execute().data or []
              if len(rows)!=1: raise RuntimeError("Original newsletter missing")
              issue=rows[0]
              if (issue["status"]!="scheduled" or issue.get("sent_at") or issue.get("mailchimp_campaign_id")!=CID
                 or issue["subject"]!=SUBJECT or as_utc(issue["scheduled_for"])!=TARGET):
                  raise RuntimeError("Original scheduled newsletter record has changed")
              joins=(db.table("newsletter_posts").select("blog_post_id,position").eq("newsletter_id",NID)
                     .order("position").execute().data or [])
              ids=[str(x["blog_post_id"]) for x in joins]
              if len(ids)!=7 or len(set(ids))!=7: raise RuntimeError("Expected exactly seven original articles")
              found=db.table("blog_posts").select("id,category,status,blogger_url,image_url").in_("id",ids).execute().data or []
              index={str(x["id"]):x for x in found}
              if len(index)!=7 or any(x not in index for x in ids): raise RuntimeError("Published stories missing")
              posts=[index[x] for x in ids]
              if [x["category"] for x in posts]!=["RECALL"]+["SHOPPERS"]*6:
                  raise RuntimeError("Original six shoppers and one recall changed")
              mail=MailchimpCampaign()
              if not mail.client: raise RuntimeError("Mailchimp connection unavailable")
              before=mail.client.campaigns.get(CID)
              if before["status"] not in ("schedule","scheduled") or as_utc(before.get("send_time"))!=TARGET:
                  raise RuntimeError("Mailchimp is not scheduled for Sat Nov 7 9 AM Central")
              if before.get("settings",{}).get("from_name")!="Youdle" or before.get("settings",{}).get("subject_line")!=SUBJECT:
                  raise RuntimeError("Youdle sender or newsletter subject has changed")
              if mail.list_id and before.get("recipients",{}).get("list_id")!=mail.list_id:
                  raise RuntimeError("Target audience changed")
              verify_only_one_edition(mail,before)
              original=mail.client.campaigns.content.get(CID).get("html") or ""
              approved=DESIGN.read_text(encoding="utf-8")
              inspect(approved,original,posts)
              already=False
              try:
                  inspect(original,original,posts)
                  already=True
              except RuntimeError: pass
              if not already:
                  mail.client.campaigns.actions.unschedule(CID)
                  if mail.client.campaigns.get(CID)["status"] not in ("save","paused"):
                      raise RuntimeError("Mailchimp did not enter editable state")
                  try:
                      mail.client.campaigns.content.update(CID,{"html":approved})
                      inspect(mail.client.campaigns.content.get(CID).get("html") or "",original,posts)
                      restored=mail.schedule_campaign(CID,TARGET)
                      if not restored.get("success"): raise RuntimeError("Reschedule failed: "+str(restored.get("error")))
                  except Exception:
                      try:
                          mail.client.campaigns.content.update(CID,{"html":original})
                          restore=mail.schedule_campaign(CID,TARGET)
                          print("ROLLBACK: original restored and rescheduled: "+str(restore.get("success")),flush=True)
                      except Exception as error:
                          print("CRITICAL: manual campaign schedule recovery required: "+type(error).__name__,flush=True)
                      raise
              after=mail.client.campaigns.get(CID)
              verify_only_one_edition(mail,after)
              live=mail.client.campaigns.content.get(CID).get("html") or ""
              inspect(live,original,posts)
              if after["status"] not in ("schedule","scheduled") or as_utc(after["send_time"])!=TARGET:
                  raise RuntimeError("Mailchimp did not verify the original Saturday 9 AM schedule")
              if after.get("settings",{}).get("from_name")!="Youdle" or after.get("settings",{}).get("subject_line")!=SUBJECT:
                  raise RuntimeError("Sender or subject changed unexpectedly")
              if live!=issue["html_content"]:
                  saved=(db.table("newsletters").update({"html_content":live,"updated_at":datetime.now(timezone.utc).isoformat()})
                         .eq("id",NID).eq("mailchimp_campaign_id",CID).eq("status","scheduled").execute().data or [])
                  if len(saved)!=1: raise RuntimeError("Mailchimp updated, Supabase sync failed")
              print("SUCCESS: Existing Mailchimp campaign 9a0996117e has approved photo-rich Youdle design",flush=True)
              print("SUCCESS: Six shopper stories and recall as #7; 7 live links, original 8 images",flush=True)
              print("SUCCESS: Visible info@getyoudle.com contact link removed from footer",flush=True)
              print("SUCCESS: One-time Saturday Nov 7, 9 AM Central schedule maintained, recurring day unchanged",flush=True)

          if __name__=="__main__":
              main()
          PY
