name: GrocerySOS November 7 catch-up (one merged newsletter)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/grocerysos-nov07-merged-catchup.yml'
      - 'scripts/schedule_nov07_merged_newsletter.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: grocerysos-nov07-single-edition
  cancel-in-progress: false
jobs:
  schedule-merged-edition:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Supabase and Mailchimp dependencies
        run: python -m pip install 'supabase>=2,<3' 'mailchimp3>=3,<4' 'pytz>=2024' 'python-dotenv>=1,<2' 'pyspellchecker>=0.7' 'fastapi>=0.104' 'pydantic>=2'
      - name: Schedule one merged GrocerySOS catch-up for Saturday 9 AM CST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
          MAILCHIMP_LIST_ID: ${{ secrets.MAILCHIMP_LIST_ID }}
          MAILCHIMP_SERVER_PREFIX: ${{ secrets.MAILCHIMP_SERVER_PREFIX }}
        run: python -m scripts.schedule_nov07_merged_newsletter
