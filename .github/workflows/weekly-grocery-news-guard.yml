name: Weekly Grocery News Deadline and Send Guard
on:
  schedule:
    - cron: '0 6 * * 4'
      timezone: 'America/Chicago'
    - cron: '30 8 * * 5'
      timezone: 'America/Chicago'
  workflow_dispatch:
    inputs:
      send:
        description: 'Send only if six published shopper stories plus a recall and verified photos are ready'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
concurrency:
  group: weekly-grocery-news-guard
  cancel-in-progress: false
jobs:
  check-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout production-reviewed newsletter scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install existing newsletter dependencies
        run: python -m pip install -r requirements.txt
      - name: Thursday readiness or Friday guarded publication
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
          MAILCHIMP_LIST_ID: ${{ secrets.MAILCHIMP_LIST_ID }}
          MAILCHIMP_SERVER_PREFIX: ${{ secrets.MAILCHIMP_SERVER_PREFIX }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ADMIN_NOTIFICATION_EMAIL: ${{ secrets.ADMIN_NOTIFICATION_EMAIL }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "30 8 * * 5" ]; then
            python -m scripts.weekly_grocery_news_guard --send
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.send }}" = "true" ]; then
            python -m scripts.weekly_grocery_news_guard --send
          else
            python -m scripts.weekly_grocery_news_guard
          fi
